<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Where Did My Money Go?</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Where Did My Money Go?</h1>
        <p>Track your spending and understand where your money goes.</p>
    </header>

    <main>

        <section class="summary">

            <div class="card">
                <h2>Balance</h2>
                <p id="balance">R 0.00</p>
            </div>

            <div class="card">
                <h2>Income</h2>
                <p id="income">R 0.00</p>
            </div>

            <div class="card">
                <h2>Expenses</h2>
                <p id="expenses">R 0.00</p>
            </div>

            <div class="card">
                <h2>Transactions</h2>
                <p id="transaction-count">0</p>
            </div>

        </section>
        <section class="transactions">

            <h2>Recent Transactions</h2>

            <table>

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <tbody id="transaction-list"></tbody>

            </table>

        </section>
        <section class="analytics">

            <h2>Spending Overview</h2>

            <div id="analytics-data">

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
